# Deploy pipeline.
#
# Two deploy targets are provided below. Enable the ONE that matches your host:
#   - Vercel     -> keep the `deploy-vercel` job, delete/ignore `deploy-pages`.
#   - GitHub Pages -> uncomment `deploy-pages`, delete/ignore `deploy-vercel`,
#                     and set base in vite.config.ts (see docs/ci-cd-pipeline-setup.md).
#
# Deploys run only on push to main, after a successful build.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Option A: Vercel
  # Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # ---------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ---------------------------------------------------------------------------
  # Option B: GitHub Pages
  # To use, uncomment this job, remove `deploy-vercel` above, and set
  # `base: '/<your-repo-name>/'` in vite.config.ts.
  # Also set Settings -> Pages -> Source = GitHub Actions.
  # ---------------------------------------------------------------------------
